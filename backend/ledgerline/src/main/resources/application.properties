
spring.application.name=LedgerLine

server.port=8080

# PostgreSQL
spring.datasource.url=${LEDGERLINE_DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
spring.datasource.username=${LEDGERLINE_DB_USERNAME:ledgerline_app}
spring.datasource.password=${LEDGERLINE_DB_PASSWORD}

# Hibernate must never create or modify financial tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns database schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Avoid exposing sensitive diagnostic details
server.error.include-message=never
server.error.include-stacktrace=never
